<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kartenspiel Multiplayer</title>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-screen" class="overlay">
        <div class="box">
            <h1>Willkommen</h1>
            <input type="text" id="player-name-input" placeholder="Dein Name" maxlength="12">
            <button onclick="joinGame()">Beitreten</button>
        </div>
    </div>

    <div id="lobby-screen" class="overlay hidden">
        <div class="box">
            <h1>Lobby</h1>
            <ul id="player-list"></ul>
            <div id="lobby-status">Warte auf Mitspieler...</div>
            
            <div id="mode-selection" class="hidden">
                <p>Wähle Modus:</p>
                <button onclick="startGame('1v1')">1 vs 1</button>
                <button onclick="startGame('2v2')">2 vs 2</button>
            </div>
            <div id="wait-msg" class="hidden">Warte auf Host...</div>
        </div>
    </div>

    <div id="game-container" class="main-layout hidden">
        
        <div class="sidebar">
            <div class="timer-box">
                Zeit: <span id="timer-display">40</span>s
            </div>

            <h3>Spielstand</h3>
            <div class="score-container">
                <table id="sidebar-score-table">
                    <thead>
                        <tr>
                            <th>Team 1</th>
                            <th>Team 2</th>
                        </tr>
                    </thead>
                    <tbody id="sidebar-score-body">
                        </tbody>
                    <tfoot>
                        <tr>
                            <td id="sb-total-t1">0</td>
                            <td id="sb-total-t2">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <h3>Verlauf</h3>
            <ul id="game-log"></ul>
        </div>

        <div class="game-board">
            <div class="player-area top" id="area-top">
                <div class="name-tag" id="name-top">Partner</div>
                <div id="hand-top" class="cards-row"></div>
            </div>

            <div class="player-area left" id="area-left">
                <div class="name-tag" id="name-left">Gegner L</div>
                <div id="hand-left" class="cards-column"></div>
            </div>

            <div class="center-table">
                <div id="tisch-bereich" class="tisch-karten"></div>
            </div>

            <div class="player-area right" id="area-right">
                <div class="name-tag" id="name-right">Gegner R</div>
                <div id="hand-right" class="cards-column"></div>
            </div>

            <div class="player-area bottom" id="area-bottom">
                <div id="hand-bottom" class="cards-row"></div>
                <div class="name-tag" id="name-bottom">ICH</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
